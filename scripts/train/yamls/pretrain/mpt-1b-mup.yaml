variables:
  data_local: ???
  data_remote:  # If blank, files must be present in data_local
  max_seq_len: ???
  global_seed: ???
  train_num_workers: ???
  eval_num_workers: ???
  eps_base: ???
  mup_config: 
    d_model_base: ???
    n_heads_base: ???
    d_heads_base: ${eval:'${.d_model_base} / ${.n_heads_base}'}
    d_heads: ${eval:'${model.d_model} / ${model.n_heads}'}
    d_model_ratio: ${eval:'${model.d_model} / ${.d_model_base}'} 
    init_std_base: ???
    param_groups: # NB: add/remove `gate_proj` entry depending on ffn_type!
      - param_str_match: attn.Wqkv.weight
        lr: ${eval:'${optimizer.lr} / ${variables.mup_config.d_model_ratio}'}
        eps: ${eval:'${variables.mup_config.eps_base} / ${variables.mup_config.d_model_ratio}'}
        weight_decay: ${eval:'${optimizer.weight_decay} * ${variables.mup_config.d_model_ratio} if "decoupled" not in "${optimizer.name}" else ${optimizer.weight_decay}'}
      - param_str_match: attn.out_proj.weight
        lr: ${eval:'${optimizer.lr} / ${variables.mup_config.d_model_ratio}'}
        eps: ${eval:'${variables.mup_config.eps_base} / ${variables.mup_config.d_model_ratio}'}
        weight_decay: ${eval:'${optimizer.weight_decay} * ${variables.mup_config.d_model_ratio} if "decoupled" not in "${optimizer.name}" else ${optimizer.weight_decay}'}
      - param_str_match: ffn.up_proj.weight
        lr: ${eval:'${optimizer.lr} / ${variables.mup_config.d_model_ratio}'}
        eps: ${eval:'${variables.mup_config.eps_base} / ${variables.mup_config.d_model_ratio}'}
        weight_decay: ${eval:'${optimizer.weight_decay} * ${variables.mup_config.d_model_ratio} if "decoupled" not in "${optimizer.name}" else ${optimizer.weight_decay}'}
      - param_str_match: ffn.down_proj.weight
        lr: ${eval:'${optimizer.lr} / ${variables.mup_config.d_model_ratio}'}
        eps: ${eval:'${variables.mup_config.eps_base} / ${variables.mup_config.d_model_ratio}'}
        weight_decay: ${eval:'${optimizer.weight_decay} * ${variables.mup_config.d_model_ratio} if "decoupled" not in "${optimizer.name}" else ${optimizer.weight_decay}'}
      # - param_str_match: ffn.gate_proj.weight
      #   lr: ${eval:'${optimizer.lr} / ${variables.mup_config.d_model_ratio}'}
      #   eps: ${eval:'${variables.mup_config.eps_base} / ${variables.mup_config.d_model_ratio}'}
      #   weight_decay: ${eval:'${optimizer.weight_decay} * ${variables.mup_config.d_model_ratio} if "decoupled" not in "${optimizer.name}" else ${optimizer.weight_decay}'}

  # Run Name
  run_name:  # If left blank, will be read from env var $RUN_NAME

max_seq_len: ${variables.max_seq_len}
run_name: ${variables.run_name}

# Model
model:
  name: mpt_causal_lm
  init_device: meta
  d_model: ???
  n_heads: ???
  n_layers: ???
  expansion_ratio: ???
  max_seq_len: ${variables.max_seq_len}
  learned_pos_emb: false
  vocab_size: ???
  resid_pdrop: 0.0
  emb_pdrop: 0.0
  embedding_fraction: 1.0
  tie_word_embeddings: true
  no_bias: true
  norm_type: rmsnorm
  norm_eps: 1e-15
  norm_weight: false # only valid for norm_type={rmsnorm, low_precision_rmsnorm}
  logit_scale: ${eval:'1 / ${variables.mup_config.d_model_ratio}'}
  fc_type: torch
  ffn_config:
    ffn_type: mptmlp
    ffn_act_fn: 
      name: relu
  attn_config:
    attn_type: multihead_attention
    attn_impl: flash
    attn_pdrop: 0.0
    n_heads: ${model.n_heads}
    softmax_scale: ${eval:'(${variables.mup_config.d_heads_base})**0.5 / ${variables.mup_config.d_heads}'}
    qk_ln: false
    qk_gn: false
    fused_qkv: true
    # norm_type: low_precision_layernorm
    # norm_eps: 1e-05
    # norm_weight: false
    clip_qkv: null
    attn_uses_sequence_id: false
    sliding_window_size: -1
    alibi: false
    rope: true
    rope_theta: 500000
    rope_impl: hf
    rope_hf_config:
      type: no_scaling
      factor: 1.0
  init_config:
    name: baseline_
    init_std: ${eval:'${variables.mup_config.init_std_base} / (${model.d_model})**0.5'}
    # d_model: null # in theory shouldn't be used, pass here as a check
    init_div_is_residual: True # True: 1 / math.sqrt(2 * cfg.n_layers)
    emb_init_std: ${eval:'${variables.mup_config.init_std_base} / (${model.vocab_size})**0.5'} # ${eval:'1e4 * (${model.d_model}/${model.vocab_size})**0.5 / ((${model.d_model})**0.5+(${model.vocab_size})**0.5)'}
    unemb_init_std: -999 # only when tied: patched in source to ${eval:'(${model.vocab_size}/${model.d_model})**0.5 / ((${model.d_model})**0.5+(${model.vocab_size})**0.5)'}

# Tokenizer
tokenizer:
  name: ???
  kwargs:
    model_max_length: ${variables.max_seq_len}
    use_fast: False

# Dataloaders
train_loader:
  name: text
  dataset:
    local:
    remote:
    split: train
    shuffle: true
    max_seq_len: ${variables.max_seq_len}
    shuffle_seed: ${variables.global_seed}
    epoch_size: ${eval:'1073741824 / ${variables.max_seq_len}'}
    streams:
      eng-fast:
        local:  "${variables.data_local}/eng-fast"
        proportion: 1 # 0.34862683488597324
      # fao:
      #   local:  "${variables.data_local}/fao"
      #   proportion: 0.5 # 4.082718707022429e-06
  drop_last: true
  num_workers: ${variables.train_num_workers}
  prefetch_factor: 2

eval_loader:
  - name: text
    label: eng-fast
    dataset:
      local:
      remote:
      split: val
      shuffle: false
      max_seq_len: ${variables.max_seq_len}
      shuffle_seed: ${variables.global_seed}
      epoch_size: null # will be set to the sum of streams
      streams:
        eng-fast:
          local:  "${variables.data_local}/eng-fast"
          repeat: 1  
    drop_last: false
    num_workers: ${variables.eval_num_workers}
    prefetch_factor: 2
  # - name: text
  #   label: fao
  #   dataset:
  #     local:
  #     remote:
  #     split: val
  #     shuffle: false
  #     max_seq_len: ${variables.max_seq_len}
  #     shuffle_seed: ${variables.global_seed}
  #     epoch_size: null # will be set to the sum of streams
  #     streams:
  #       fao:
  #         local:  "${variables.data_local}/fao"
  #         repeat: 1      
  #   drop_last: false
  #   num_workers: ${variables.eval_num_workers}
  #   prefetch_factor: 2

