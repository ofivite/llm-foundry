# Optimization
scheduler:
  name: ???
  t_warmup: ???
  t_constant: ???
  t_decay: ???
  alpha_f: ???

optimizer:
  name: ???
  lr: ${eval:'${variables.lr_base}'} #  * (${model.d_model} / 256)
  momentum: ???
  nesterov: ???
  dual_norm_scaling: ${variables.dual_norm_scaling}
  eps: ${variables.eps_base}
  norm_factor: 'linear'
  backend: 'newtonschulz5'
  param_groups: # NB: add/remove `gate_proj` entry depending on ffn_type!
    - param_str_match: wte.weight
      lr: ${eval:'${variables.embedding_lr_base} / (256)**0.5'} # ${eval:'${variables.embedding_lr_base} / 256 * ${model.d_model}**0.5'}   ////////   ${eval:'${variables.embedding_lr_base} / (256)**0.5'}
      momentum: ${variables.embedding_momentum}
      nesterov: ${variables.embedding_nesterov}
      norm_factor: ${variables.embedding_norm_factor}
      backend: ${variables.embedding_backend}
      dual_norm_scaling: ${variables.embedding_dual}
    - param_str_match: lm_head.weight
      lr: ${eval:'${variables.embedding_lr_base} * 256 / (${model.d_model})**0.5'}
      momentum: ${variables.embedding_momentum}
      nesterov: ${variables.embedding_nesterov}
      norm_factor: ${variables.unembedding_norm_factor}
      backend: ${variables.unembedding_backend}
