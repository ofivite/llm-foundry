  #   init_std: ${eval:'1 / ${model.d_model}**0.5'}
  #   # d_model: null # in theory shouldn't be used, pass here as a check
  #   init_div_is_residual: True # True: 1 / math.sqrt(2 * cfg.n_layers)
  #   emb_init_std: ${eval:'1e4 * (${model.d_model}/${model.vocab_size})**0.5 / ((${model.d_model})**0.5+(${model.vocab_size})**0.5)'}
