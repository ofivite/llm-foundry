# Model
model:
  name: mpt_causal_lm
  init_device: meta
  d_model: ???
  n_heads: ???
  n_layers: ???
  expansion_ratio: ???
  max_seq_len: ${variables.max_seq_len}
  learned_pos_emb: false
  vocab_size: ???
  resid_pdrop: 0.0
  emb_pdrop: 0.0
  embedding_fraction: 1.0
  tie_word_embeddings: false
  no_bias: true
  norm_type: ???
  norm_eps: 1e-15
  norm_weight: false # only valid for norm_type={rmsnorm, low_precision_rmsnorm}
  logit_scale: 1.0 # ${eval:'(256 / ${model.d_model})**0.5'}
  fc_type: torch
  ffn_config:
    ffn_type: mptmlp
    ffn_act_fn: 
      name: relu
  attn_config:
    attn_type: multihead_attention
    attn_impl: flash
    attn_pdrop: 0.0
    n_heads: ${model.n_heads}
    softmax_scale: ${eval:'1 / (${model.d_model} / ${model.n_heads})**0.5'}
    qk_ln: false
    qk_gn: false
    fused_qkv: true
    clip_qkv: null
    attn_uses_sequence_id: false
    sliding_window_size: -1
    alibi: false
    rope: true
    rope_theta: 500000
    rope_impl: hf
    rope_hf_config:
      type: no_scaling
      factor: 1.0
  init_config:
    name: baseline_
    init_std: ${eval:'${variables.init_std_base} / (${model.d_model})**0.5'}
    # d_model: null # in theory shouldn't be used, pass here as a check
    init_div_is_residual: True # True: 1 / math.sqrt(2 * cfg.n_layers)
    emb_init_std: ${eval:'${variables.emb_init_std_base} / (256)**0.5'} # ${eval:'1e4 * (${model.d_model}/${model.vocab_size})**0.5 / ((${model.d_model})**0.5+(${model.vocab_size})**0.5)'}
    unemb_init_std: -999 # patched in source to: ${eval:'(${model.vocab_size}/${model.d_model})**0.5 / ((${model.d_model})**0.5+(${model.vocab_size})**0.5)'}

  # init_config: # init v3
